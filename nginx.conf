server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /assets/hero-chef.jpg { try_files /assets/chef.svg =404; }
  location = /assets/chef-footer.jpg { try_files /assets/chef.svg =404; }
  location ~ ^/assets/.*\.jpg$ { try_files $uri /assets/food.svg; }

  location / {
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '6281992310576' '855964065246';
    sub_filter 'https://t.me/share/url?url=&text=' 'https://t.me/kh_digital?text=';
    sub_filter '</body>' '<script src="/demo-overrides.js"></script></body>';
    try_files $uri $uri/ /index.html;
  }
}
